aid: wato
name: Wato
description: >-
  Wato is the control point for AI agents at work — a governed, shared AI
  workspace that gives teams reviewed memory, approved MCP connectors and tools,
  versioned skills, cloud agent sessions, triggered automations, live artifacts
  and dashboards, and full tool-call tracing, all exposed to Claude Code, Codex,
  Cursor, and any MCP-compatible client through a single remote MCP gateway.
  Login, SSO, and directory sync are handled by WorkOS; agents only ever see a
  team's reviewed memory and approved tools, never raw credentials, and every
  MCP call is recorded as an auditable trace. Wato is a Y Combinator (Spring
  2026) company based in San Francisco.
