apis:
- name: Wato MCP Gateway
  description: >-
    Wato exposes each team's reviewed memory and approved connector tools through
    a single remote MCP (Model Context Protocol) gateway over Streamable HTTP with
    OAuth. Any MCP-capable client (Claude Code, Codex, Cursor, or other remote MCP
    clients) can read and draft memory, discover and run approved connector tools,
    manage skills, and build automation drafts through the governed gateway.
